apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: openshift-sandboxed-containers-aws
  namespace: openshift-cloud-credential-operator
spec:
  secretRef:
    name: cco-secret
    namespace: openshift-sandboxed-containers-operator
  serviceAccountNames:
    - default
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
    - effect: Allow
      resource: "*"
      action:
        - "ec2:*"
        # By default we allow all ec2 actions to prevent dysfunctioning for untested configurations.
        # The following actions were extracted from AWS CloudTrail Event History,
        # filtered based on access key, for peer-pod execution with default configuration.
        # use it to restrict the requested permissions.
        #- ec2:AuthorizeSecurityGroupIngress
        #- ec2:CreateDefaultVpc
        #- ec2:CreateImage
        #- ec2:CreateKeyPair
        #- ec2:CreateTags
        #- ec2:CreateSecurityGroup
        #- ec2:DeleteKeyPair
        #- ec2:DeleteSecurityGroup
        #- ec2:DescribeImages
        #- ec2:DescribeInstances
        #- ec2:DescribeInstanceTypes
        #- ec2:DescribeRegions
        #- ec2:DescribeSecurityGroups
        #- ec2:DescribeSubnets
        #- ec2:DescribeVolumes
        #- ec2:DescribeVpcs
        #- ec2:RunInstances
        #- ec2:StopInstances
        #- ec2:TerminateInstances

      ##### Below is Extended Policy: Image Creation Operations #####

      # VMImport Role Management
      - effect: Allow
        action:
          - iam:CreateRole
          - iam:PutRolePolicy
          - iam:GetRole
          - iam:ListRolePolicies
          - iam:DeleteRole
          - iam:DeleteRolePolicy
          # Required by ec2:ImportSnapshot/ImportImage: AWS now enforces that the
          # calling principal has iam:PassRole on the vmimport service role.
          - iam:PassRole
        resource: "arn:aws:iam::*:role/vmimport"

      # S3 Bucket Management
      - effect: Allow
        action:
          - s3:CreateBucket
          - s3:DeleteBucket
          - s3:GetBucketLocation
          - s3:ListBucket
          - s3:GetBucketAcl
        resource: "arn:aws:s3:::podvm-*"

      # S3 Object Management
      - effect: Allow
        action:
          - s3:PutObject
          - s3:GetObject
          - s3:DeleteObject
        resource: "arn:aws:s3:::podvm-*/*"

      # S3 List All Buckets
      - effect: Allow
        action:
          - s3:ListAllMyBuckets
        resource: "*"
