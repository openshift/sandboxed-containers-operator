apiVersion: batch/v1
kind: Job
metadata:
  name: osc-podvm-image-creation
  namespace: openshift-sandboxed-containers-operator
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 1
  template:
    metadata:
      name: osc-podvm-image-creation
    spec:
      # Add initContainers to pull the image from the registry and copy
      # /podvm-binaries.tar.gz /payload/podvm-binaries.tar.gz
      initContainers:
        - name: copy
          image: registry.redhat.io/openshift-sandboxed-containers/osc-podvm-payload-rhel9:1.12.1  ## OSC_VERSION
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Copying the payload files"
              cp /podvm-binaries.tar.gz /payload/podvm-binaries.tar.gz || exit 1
              echo "Copied the payload files successfully"
          volumeMounts:
            - name: payload
              mountPath: /payload
      containers:
        - name: create
          # Binaries like kubectl, packer and yq are expected to be under /usr/local/bin
          # podvm binaries are expected to be under /payload/podvm-binaries.tar.gz
          image: registry.redhat.io/openshift-sandboxed-containers/osc-podvm-builder-rhel9:1.12.1  ## OSC_VERSION
          # This image contains the following
          # azure-podvm-image-handler.sh script under /scripts/azure-podvm-image-handler.sh
          # aws-podvm-image-handler.sh script under /scripts/aws-podvm-image-handler.sh
          # gcp-podvm-image-handler.sh script under /scripts/gcp-podvm-image-handler.sh
          # ibmcloud-podvm-image-handler.sh script under /scripts/ibmcloud-podvm-image-handler.sh
          # sources for cloud-api-adaptor under /src/cloud-api-adaptor
          lifecycle: 
            preStop: 
              exec: 
                command: ["/scripts/packer-resource-cleanup.sh"]
          securityContext: # TODO: evaluate if these are actually needed
            privileged: true
            allowPrivilegeEscalation: true
            runAsNonRoot: false
            seLinuxOptions:
              type: unconfined_t
            capabilities:
             allow:
               - ALL
            runAsUser: 0 # needed for container mode dnf access
          envFrom:
            - secretRef:
                name: peer-pods-secret
            - secretRef:
                name: peer-pods-image-creation-secret # must come after peer-pods-secret to override the values
                optional: true
            - configMapRef:
                name: peer-pods-cm
                optional: true
            - configMapRef:
                name: azure-podvm-image-cm
                optional: true
            - configMapRef:
                name: aws-podvm-image-cm
                optional: true
            - configMapRef:
                name: gcp-podvm-image-cm
                optional: true
            - configMapRef:
                name: ibmcloud-podvm-image-cm
                optional: true
            - configMapRef:
                name: libvirt-podvm-image-cm
                optional: true
          command: ["/podvm-builder.sh", "create"]
          volumeMounts:
            - name: payload
              mountPath: /payload
            - name: regauth
              mountPath: /tmp/regauth
            - name: ssh-key-secret
              mountPath: "/root/.ssh/"
              readOnly: true
            - name: store-volume
              mountPath: /store
            - name: registries-conf
              mountPath: /etc/containers/registries.conf
              readOnly: true
            - name: registries-conf-d
              mountPath: /etc/containers/registries.conf.d
              readOnly: true
            - name: containers-auth
              mountPath:  /root/.config/containers/auth.json
              readOnly: true
            - name: containers-policy
              mountPath: /etc/containers/policy.json
              readOnly: true
            - name: bound-sa-token
              mountPath: /var/run/secrets/openshift/serviceaccount
              readOnly: true
      # Default is 30s which is too less for the preStop hook to fully execute        
      terminationGracePeriodSeconds: 180
      volumes:
        - name: payload
          emptyDir: {}
        - name: bound-sa-token
          projected:
            sources:
            - serviceAccountToken:
                path: token
                audience: openshift
        - name: regauth
          secret:
            secretName: auth-json-secret
        - name: ssh-key-secret
          secret:
            secretName: ssh-key-secret
            items:
            - key: id_rsa
              path: "id_rsa"
            defaultMode: 0400
            optional: true
        - name: store-volume
          emptyDir: {}
        - name: registries-conf
          hostPath:
            path: /etc/containers/registries.conf
            type: FileOrCreate
        - name: registries-conf-d
          hostPath:
            path: /etc/containers/registries.conf.d
            type: DirectoryOrCreate
        - name: containers-auth
          hostPath:
            path: /var/lib/kubelet/config.json
            type: File
        - name: containers-policy
          hostPath:
            path: /etc/containers/policy.json
            type: FileOrCreate
      restartPolicy: Never
