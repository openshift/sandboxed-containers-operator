apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/sandboxed-containers-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression:
      event == "pull_request" &&
      target_branch == "devel" &&
      files.all.exists(path, path.matches('.tekton/fbc-pipeline.yaml$|.tekton/osc-fbc-5-0-.*.yaml$|fbc/v5.0/Dockerfile$|fbc/v5.0/.*/catalog.json$'))
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: osc-fbc-5-0
    appstudio.openshift.io/component: osc-fbc-5-0
    pipelines.appstudio.openshift.io/type: build
  name: osc-fbc-5-0-on-pull-request
  namespace: ose-osc-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ose-osc-tenant/osc-fbc-5-0:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: path-context
    value: fbc/v5.0
  - name: dockerfile
    value: fbc/v5.0/Dockerfile
  pipelineRef:
    name: fbc-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-osc-fbc-5-0
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
