apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: sandboxed-containers-operator
  name: openshift-sandboxed-containers-monitor
spec:
  endpoints:
  - port: metrics
  namespaceSelector:
    matchNames:
    - openshift-sandboxed-containers-operator
  selector:
    matchLabels:
      name: openshift-sandboxed-containers-monitor
