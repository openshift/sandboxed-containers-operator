name: Check go fmt

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-actionlint:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install toolchain
        run: |
          apt update
          apt -y install make golang curl

      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run go fmt
        run: |
          if [ "$(go fmt ./...)" != "" ]; then
            echo "go fmt returns changes:" && git diff && exit 1
          fi

