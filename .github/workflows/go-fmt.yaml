# Verify that all Go code is properly formatted.
---
name: go-fmt

on:
  pull_request:
    paths:
      - '**/*.go'
      - '!test/e2e/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  go-fmt:
    name: go-fmt
    if: github.event.pull_request.user.login != 'red-hat-konflux[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Check go fmt
        run: |
          bad=$(find . -name '*.go' -not -path './test/e2e/*' -not -path './config/peerpods/podvm/cloud-api-adaptor/*' -print0 | xargs -0 gofmt -l)
          if [ -n "$bad" ]; then
            echo "::error::The following files are not properly formatted:"
            echo "$bad"
            echo ""
            echo "Please run 'make fmt' locally and commit the changes."
            exit 1
          fi
