name: Verify no modified files left after build

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-actionlint:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-24.04
    steps:
      - name: Install toolchain
        run: |
          apt update
          apt -y install make golang curl

      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the operator and bundle
        run: make docker-build && make bundle

      - name: Check for modified files
        run: |
          if [ "$(git diff | grep -e "^- " -e "^+ " | grep -v "createdAt" -c)" != "0" ]; then
            echo "Uncommitted modification after build" && git diff && exit 1
          fi

